<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>修改密码 · 抽了马</title>
  <link rel="stylesheet" href="/brand-b.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh}
    main{max-width:480px;margin:clamp(36px,8vh,90px) auto;padding:0 18px}
    .card{padding:clamp(24px,5vw,42px)}h1{font-size:29px;margin:12px 0 9px}
    p{line-height:1.7;margin:0 0 26px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    #message{min-height:24px;margin:13px 0 0;color:#a63c48;font-size:13px}
  </style>
</head>
<body>
  <header class="b-header"><a class="b-brand" href="/home.html"><img src="/horse-tight-192.png" alt="">抽了马</a><span class="b-badge">账号安全</span></header>
  <main><section class="b-card card">
    <span class="b-eyebrow">ACCOUNT SECURITY</span><h1>修改密码</h1>
    <p class="b-muted" id="intro">修改后，所有设备将退出登录。请用新密码重新登录。</p>
    <form id="form">
      <label class="b-field">当前密码<input id="current" type="password" autocomplete="current-password" required></label>
      <label class="b-field">新密码（8 至 128 位）<input id="nextPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <label class="b-field">再次输入新密码<input id="confirm" type="password" autocomplete="new-password" required></label>
      <div class="actions"><button class="b-primary" type="submit">保存新密码</button><a class="b-secondary" href="/home.html" id="back">返回首页</a></div>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </section></main>
  <script>
    const $=id=>document.getElementById(id),target=new URLSearchParams(location.search).get('next')||'/home.html';
    const safeTarget=target.startsWith('/')&&!target.startsWith('//')?target:'/home.html';
    fetch('/api/me').then(async r=>{if(r.status===401){location.href='/login.html?next='+encodeURIComponent('/password.html?next='+encodeURIComponent(safeTarget));return;}const d=await r.json();if(d.user?.must_change_password){$('intro').textContent='管理员已重置密码。请先设置自己的新密码，再继续使用。';$('back').hidden=true;}}).catch(()=>{});
    $('form').onsubmit=async e=>{e.preventDefault();const current=$('current').value,next=$('nextPassword').value;
      if(next!==$('confirm').value){$('message').textContent='两次输入的新密码不一致';return;}
      const button=$('form').querySelector('button');button.disabled=true;$('message').textContent='正在保存…';
      try{const r=await fetch('/api/password/change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:current,new_password:next})});const d=await r.json();if(!r.ok){$('message').textContent=d.error||d.detail||'修改失败';return;}
        location.href='/login.html?next='+encodeURIComponent(safeTarget);
      }catch{$('message').textContent='网络暂不可用，请稍后重试';}finally{button.disabled=false;}
    };
  </script>
</body>
</html>
