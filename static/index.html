<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽了马 · 3D 抽奖台</title><link rel="icon" href="/favicon-tight-64.png"><link rel="stylesheet" href="/v6/studio.css?v=vu15-preview-honesty-1"><link rel="stylesheet" href="/brand-b.css?v=ce-admin-entry-1"><script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script></head><body class="studio-page">
<header class="topbar"><a class="brand" href="/home.html"><img src="/horse-tight-192.png" alt=""><strong>抽了马<span>3D 抽奖工作台</span></strong></a><div class="header-right"><a class="quiet" href="/home.html">玩法首页</a><span class="free-pill"><i></i> 免费抽，尽兴玩</span><button id="libraryButton" class="quiet">我的配置</button><a id="adminLink" class="quiet" href="/admin.html" hidden>超管后台</a><button id="accountButton" class="account">登录 / 免费注册 ↗</button></div></header>
<main class="workspace"><aside class="sidebar"><p class="eyebrow">选玩法</p><nav class="applications" aria-label="应用">
<button data-app="food" class="app active"><span class="app-icon">🍜</span><span>抽吃什么<small>让每一餐都有惊喜</small></span><b>↗</b></button><button data-app="play" class="app"><span class="app-icon">✦</span><span>抽玩什么<small>发现下一个好主意</small></span><b>↗</b></button><button data-app="prize" class="app"><span class="app-icon">🎁</span><span>抽奖品<small>让好运找到主人</small></span><b>↗</b></button><button data-app="person" class="app"><span class="app-icon">◎</span><span>抽点名<small>下一位，就是你</small></span><b>↗</b></button></nav>
<div class="sidebar-divider"></div><p class="eyebrow">选机台</p><div class="machines"><button data-machine="wheel"><span>◉</span><div>经典转盘<small>转动期待</small></div><em>免费</em></button><button data-machine="capsule" class="active"><span>◒</span><div>胶囊机<small>打开未知</small></div><em>免费</em></button><button data-machine="sphere"><span>◌</span><div>姓名星球<small>发现主角</small></div><em>免费</em></button></div>
<button id="themeButton" class="cosmic-card"><span>✧ STARLIGHT EDITION</span><strong>免费预览星空胶囊 ↗</strong><small>完整演出可免费预览</small></button></aside>
<section class="stage-panel"><div class="stage-heading"><div><p class="eyebrow" id="sceneKicker">3D 抽奖工作台</p><h1 id="sceneTitle">今天吃点什么？</h1><p id="sceneSubtitle">不纠结，抽一下。让一颗胶囊替你决定。</p></div><span class="scene-number" id="sceneNumber" aria-hidden="true"></span></div>
<div class="stage-tools"><button id="muteButton" aria-label="切换声音">♪</button><button id="fullscreenButton" aria-label="全屏">⛶</button><select id="quality" aria-label="画质"><option value="high" selected>最高画质</option><option value="auto">自动画质</option><option value="medium">均衡 3D</option><option value="low">轻量 3D</option></select><label><input type="checkbox" id="reduceMotion">简洁动效</label></div>
<img id="brandLogo" alt="活动 Logo" hidden><div id="stage" aria-label="可以拖动查看、点击启动的 3D 机台"><div id="stageLoading">正在准备你的 3D 机台…</div></div><div class="stage-meta"><span><i></i> <span id="modeBadge">经典 · 免费</span></span><span id="poolBadge">8 个候选</span></div>
<div id="result" class="result-card" hidden aria-live="polite"><small id="resultKicker">这次就选</small><h2 id="resultName"></h2><ol id="multiResult" aria-label="本页抽取结果" hidden></ol><nav id="resultPagination" class="result-pagination" aria-label="抽取结果分页" hidden><button id="resultPrevious" type="button" disabled>上一页</button><span id="resultPageInfo" aria-live="polite"></span><button id="resultNext" type="button" disabled>下一页</button></nav><div id="groupResult"></div><div class="result-actions"><button id="acceptButton" aria-label="确定并收起已保存结果">确定，收起</button><button id="copyButton">复制结果</button><button id="closeResult" aria-label="收起已保存结果">收起</button></div></div>
<div class="draw-zone"><div class="draw-context" id="drawContext">随机选择 · 一次一个 · 不限次数</div><button id="drawButton" class="draw-button"><span>✦</span><strong>抽一道</strong><span>↗</span></button><button id="skipButton" hidden class="quiet" aria-label="直接揭晓已保存结果">直接揭晓</button><p>点击机台也能抽取 <span>·</span> 拖动，换个角度看看</p></div><button id="mobileSettings" class="mobile-settings">☷ 候选与设置</button></section>
<aside class="settings" id="settingsPanel"><div class="panel-heading"><h2>这次怎么抽</h2><button id="closeSettings" class="quiet">✕</button></div><label class="field">配置名称<input id="configTitle" maxlength="80" value="今天吃什么"></label><div class="preset-row" id="presets"></div><label class="field">抽取规则<select id="drawMode"></select></label><div class="field-row"><label class="field">每次人数 / 数量<input id="drawCount" type="number" min="1" max="50" value="1"></label><label class="field" id="groupField" hidden>分成几组<input id="groupCount" type="number" min="2" max="50" value="2"></label></div>
<div class="field-heading"><label for="candidates">候选清单</label><span id="candidateCount">8 项</span></div><textarea id="candidates" rows="8" spellcheck="false" aria-label="候选清单"></textarea><button id="importButton" class="wide">导入 CSV / Excel · 专业</button><input id="importFile" type="file" accept=".csv,.xlsx" hidden><p class="helper" id="candidateHelp">每行一项；行首加 ! 临时排除。重名按编号区分。</p>
<label class="field" id="tagFilterField">仅抽这个标签<select id="tagFilter"><option value="">全部标签</option></select></label><p class="helper" id="runProgress" aria-live="polite"></p><div id="prizeSettings" hidden><label class="field">奖项与名额<textarea id="awards" rows="3" placeholder="一等奖,1&#10;二等奖,3"></textarea></label><label class="checkbox"><input id="crossUnique" type="checkbox" checked>跨奖项不重复中奖</label><label class="field">当前奖项<select id="currentAward"></select></label><label class="field">舞台标题 · 专业<input id="brandTitle" maxlength="80" placeholder="例如：2026 年度盛典"></label></div>
<div class="brand-files"><label class="field">舞台 Logo · 专业<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="field">舞台背景 · 专业<input id="backdropFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="clearBrand" class="wide">清除品牌图片</button></div><label class="checkbox"><input type="checkbox" id="rehearsal">演练 / 免费预览专业功能</label><div class="panel-actions"><button id="applyButton" class="solid">应用设置</button><button id="saveButton">保存配置</button></div><div class="panel-actions"><button id="newRoundButton">新开一轮</button><button id="historyButton">抽取记录 ↗</button></div><button id="displayButton" class="wide">打开观众大屏 ⛶</button><button id="classSwitch" class="wide">切换班级 / 继续课次 · 专业</button><button id="classReport" class="wide">跨课次统计 · 专业</button><button id="mobileMachine" class="wide">更换机台 / 主题</button><div class="rule-note"><b>你的规则，清清楚楚。</b><p>不重复规则不会自动重置。抽取结果先保存，再由机台揭晓。</p></div></aside></main>
<div id="toast" role="status" hidden></div><dialog id="modal"><div class="modal-heading"><h2 id="modalTitle"></h2><button id="modalClose">✕</button></div><div id="modalBody"></div></dialog><script type="module" src="/v6/studio.js?v=ce-admin-entry-1"></script></body></html>
