<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>机台渲染测试夹具</title>
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #0c1219; color: #e9eff5; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; }
    main { max-width: 1050px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 1.35rem; }
    .notice { margin: 0 0 16px; color: #f2d18a; font-weight: 650; }
    .controls { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    label { display: grid; gap: 4px; font-size: .88rem; color: #b9c8d8; }
    select, button { min-height: 40px; padding: 8px 11px; border: 1px solid #42556a; border-radius: 8px; background: #182431; color: inherit; font: inherit; }
    button { cursor: pointer; font-weight: 650; }
    button:disabled, select:disabled { opacity: .5; cursor: not-allowed; }
    button.primary { background: #245d72; border-color: #438ca0; }
    .check { display: flex; align-items: center; min-height: 40px; gap: 7px; }
    .check input { width: 18px; height: 18px; }
    .context-test { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 0; padding: 10px 12px; border: 1px solid #594c37; border-radius: 10px; background: #191912; }
    .context-test strong { margin-right: 4px; color: #f2d18a; }
    .context-test output { flex: 1 1 100%; color: #c5d2de; }
    .readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 16px; padding: 10px 12px; border: 1px solid #293a4b; border-radius: 10px; background: #111b25; font-size: .9rem; }
    .readout b { color: #98d9e8; }
    #stage { width: min(862px, 100%); height: 350px; margin: 12px auto 0; overflow: hidden; border: 1px solid #25394a; border-radius: 12px; background: radial-gradient(ellipse at 50% 50%, #202b38, #101820 70%); }
    #stage canvas { display: block; width: 100%; height: 100%; }
    @media (max-width: 600px) { body { padding: 12px; } #stage { height: 372px; } }
  </style>
</head>
<body>
  <main>
    <h1>机台渲染测试夹具</h1>
    <p class="notice">仅渲染测试 · 模拟结果 · 无后台请求</p>
    <section class="controls" aria-label="渲染测试控制">
      <label>机台<select id="machine"><option value="sphere">姓名星球</option><option value="wheel">珐琅转盘</option><option value="capsule">胶囊机</option></select></label>
      <label>主题（应用名单后生效）<select id="theme"><option value="classic">经典</option><option value="cosmic" disabled>星空胶囊</option></select></label>
      <label>可见候选数<select id="count"><option>1</option><option>2</option><option>8</option><option>12</option><option>13</option><option>48</option><option>100</option><option>500</option><option>1000</option></select></label>
      <button id="apply">应用名单</button>
      <label>抽取目标<select id="target"></select></label>
      <label>运行后停针<select id="runDuration"><option value="5200">正常 5.2 秒</option><option value="200">早停 0.2 秒</option><option value="1000">早停 1 秒</option></select></label>
      <label class="check"><input id="reduced" type="checkbox">简洁动效</label>
      <label class="check"><input id="diagnosticVisible" type="checkbox" checked>显示诊断</label>
      <label>画质<select id="quality"><option value="high" selected>最高</option><option value="auto">自动</option><option value="medium">均衡</option><option value="low">轻量</option></select></label>
      <button id="full" class="primary">完整演示</button>
      <button id="direct">直接揭晓</button>
      <button id="lateSkip">停针抬升时跳过</button>
      <button id="reset">重置舞台</button>
    </section>
    <section class="context-test" aria-label="WebGL 上下文生命周期测试">
      <strong>WebGL 生命周期测试（只影响本夹具）</strong>
      <button id="loseContext" type="button" disabled>模拟 WebGL 丢失</button>
      <button id="restoreContext" type="button" disabled>恢复 WebGL</button>
      <output id="contextStatus" role="status" aria-live="polite">正在检查 WEBGL_lose_context…</output>
    </section>
    <section class="readout" aria-live="polite">
      <span>可见候选总数：<b id="total">1</b></span>
      <span>当前选择：<b id="selection">0 · visual-candidate-0001 · 重复姓名</b></span>
      <span>本轮快照：<b id="snapshot">—</b></span>
      <span>当前阶段：<b id="phase">待机</b></span>
      <span>机台启动回调次数：<b id="activations">0</b></span>
      <span>转盘节拍：<b id="ticks">0</b> · 最短间隔：<b id="tickGap">—</b></span>
      <span>揭晓等待：<b id="revealWait">—</b></span>
    </section>
    <div id="stage" aria-label="机台 3D 渲染区域"></div>
  </main>
  <script type="module" src="/fixtures/stage-harness.mjs"></script>
</body>
</html>
